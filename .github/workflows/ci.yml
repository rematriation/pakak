

name: CI

# Trigger on every push or pull request to any branch
on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      # Check out the repo
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '18.x'
          cache: 'npm'

      # Install dependencies
      - name: Install dependencies
        run: npm ci

      # Run linter
      - name: Run linter
        run: |
          npm run lint

      # Build
      - name: Build project
        run: npm run build

      # Run tests
      - name: Run tests
        run: npm test