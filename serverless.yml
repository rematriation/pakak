# "org" ensures this Service is used with the correct Serverless Framework Access Key.
org: rematriation
# "app" enables Serverless Framework Dashboard features and sharing them with other Services.
app: nalukataq
service: nalukataq 

variablesResolutionMode: 20210326
useDotenv: true

frameworkVersion: ~4.15.1

# ───────── Global defaults & per-stage naming ─────────
provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  stackName: nalukataq-${self:provider.stage}

  environment:
    APP_STAGE: ${self:provider.stage}

    DYNAMODB_TABLE: NalukataqUsers-${self:provider.stage}

    # MONGODB_URI: ${ssm:/nalukataq/${self:provider.stage}/MONGODB_URI}
    # MONGODB_DBNAME: nalukataq_${self:provider.stage}

    TWILIO_NUMBER: ${ssm:/nalukataq/${self:provider.stage}/TWILIO_NUMBER}
    TWILIO_ACCOUNT_SID: ${ssm:/nalukataq/${self:provider.stage}/TWILIO_SID}
    TWILIO_AUTH_TOKEN: ${ssm:/nalukataq/${self:provider.stage}/TWILIO_TOKEN}

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:Scan
          Resource: arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.DYNAMODB_TABLE}

        - Effect: Allow
          Action: sqs:*
          Resource:
            - arn:aws:sqs:${self:provider.region}:*:nalukataq-incoming-${self:provider.stage}.fifo
            - arn:aws:sqs:${self:provider.region}:*:nalukataq-outgoing-${self:provider.stage}.fifo

        - Effect: Allow
          Action: s3:*
          Resource:
            - arn:aws:s3:::nalukataq-raw-${self:provider.stage}/*
            - arn:aws:s3:::nalukataq-clean-${self:provider.stage}/*
            - arn:aws:s3:::nalukataq-quarantine-${self:provider.stage}/*

plugins:
  - serverless-offline 
  # - serverless-localstack

custom:
  serverless-offline:
    httpPort: 3000
  localstack:
    stages:
      - dev

# ───────── Lambda Functions ─────────
functions:
  firewall:
    handler: dist/functions/firewall/handler.handler
    memorySize: 256
    timeout: 3
    events:
      - httpApi: { path: "/${self:provider.stage}/webhook", method: post }

  worker:
    handler: dist/functions/worker/handler.handler
    events:
      - sqs:
          arn: { "Fn::GetAtt": [ IncomingQueue, Arn ] }
          batchSize: 10

  scanner:
    handler: dist/functions/scanner/handler.handler
    memorySize: 1024
    timeout: 30
    events:
      - s3:
          bucket: nalukataq-raw-${self:provider.stage}
          event: s3:ObjectCreated:*

  dispatcher:
    handler: dist/functions/dispatcher/handler.handler
    memorySize: 256
    timeout: 30
    events:
      - sqs:
          arn: { "Fn::GetAtt": [ OutgoingQueue, Arn ] }
          batchSize: 1
          maximumConcurrency: 2 

  cleaner:
    handler: dist/functions/cleaner/handler.handler
    events:
      - schedule:
          rate: cron(0 12 * * ? *)

# ───────── CloudFormation Resources ─────────
resources:
  Resources:

    # DynamoDB
    UsersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.DYNAMODB_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: phone
            AttributeType: S
          - AttributeName: awaitingDeletion
            AttributeType: N
        KeySchema:
          - AttributeName: phone
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: DeletionPendingIndex
            KeySchema:
              - AttributeName: awaitingDeletion
                KeyType: HASH
            Projection:
              ProjectionType: ALL

    # DLQs
    IncomingDLQ:
      Type: AWS::SQS::Queue
      Properties:
        FifoQueue: true
        QueueName: nalukataq-incoming-dlq-${self:provider.stage}.fifo

    OutgoingDLQ:
      Type: AWS::SQS::Queue
      Properties:
        FifoQueue: true
        QueueName: nalukataq-outgoing-dlq-${self:provider.stage}.fifo

    # Main FIFO queues
    IncomingQueue:
      Type: AWS::SQS::Queue
      Properties:
        FifoQueue: true
        QueueName: nalukataq-incoming-${self:provider.stage}.fifo
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt IncomingDLQ.Arn
          maxReceiveCount: 3

    OutgoingQueue:
      Type: AWS::SQS::Queue
      Properties:
        FifoQueue: true
        QueueName: nalukataq-outgoing-${self:provider.stage}.fifo
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt OutgoingDLQ.Arn
          maxReceiveCount: 3

    # S3 buckets
    
    # RawBucket:
    #   Type: AWS::S3::Bucket
    #   Properties:
    #     BucketName: nalukataq-raw-${self:provider.stage}
    #     NotificationConfiguration:
    #       LambdaConfigurations:
    #         - Event: s3:ObjectCreated:*
    #           Function: 
    #             Fn::GetAtt: [ ScannerLambdaFunction, Arn ]

    CleanBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: nalukataq-clean-${self:provider.stage}

    QuarantineBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: nalukataq-quarantine-${self:provider.stage}